# ==========================================
# Smart Campus
# UIU Advanced OOP Project Configuration
# ==========================================

spring.application.name=smart-campus
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8085}
server.address=0.0.0.0

# Persist login sessions in JDBC so Railway restarts/deployments keep users signed in.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.schema=classpath:schema-spring-session.sql
spring.session.timeout=${SMART_CAMPUS_SESSION_TIMEOUT:7d}
server.servlet.session.cookie.name=SMARTCAMPUS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ==========================================
# Database Configuration (H2 In-Memory)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smart_campus_db;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Dhaka
spring.jackson.time-zone=Asia/Dhaka
spring.jackson.serialization.fail-on-empty-beans=false

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Logging
logging.level.bd.ac.uiu.smartcampus=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=WARN

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gemini AI Chatbot
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.7-flash}
gemini.api.base-url=${GEMINI_API_BASE_URL:http://127.0.0.1:8081/v1}

# SSLCommerz cafeteria checkout
sslcommerz.store-id=${STORE_ID:}
sslcommerz.store-password=${STORE_PASSWORD:}
sslcommerz.live=${IS_LIVE:false}
smart-campus.public-base-url=${SMART_CAMPUS_PUBLIC_BASE_URL:}
